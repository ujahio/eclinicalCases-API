# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: eccs-labs
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: clinical
# "service" is the name of this project. This will also be added to your AWS resource names.
service: clinical-backend

plugins:
  - serverless-dynamodb-local
  - serverless-s3-local
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8080

  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      heapInitial: 200m
      heapMax: 1g
      migrate: true
      seed: true
      convertEmptyValues: true
    seed:
      local:
        sources:
          - table: usersTable

  s3:
    bucket: my-bucket
    region: us-east-1
    host: localhost
    port: 4599
    accessKey: "ACCESS_KEY"
    secretKey: "SECRET_KEY"

# stages:
#   default:
#     params:
#       tableName: "users-table-${sls:stage}"

provider:
  name: aws
  runtime: nodejs20.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  # environment:
  #   USERS_TABLE: ${param:tableName}

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: "*"
    timeout: 300

resources:
  Resources:
    usersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: usersTable
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    LocalBucket:
      Type: "AWS::S3::Bucket"
      Properties:
        BucketName: local-bucket
