# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: eccs-labs
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: clinical
# "service" is the name of this project. This will also be added to your AWS resource names.
service: clinical-backend

plugins:
  - serverless-dynamodb-local
  - serverless-s3-local
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8080

  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      heapInitial: 200m
      heapMax: 1g
      migrate: true
      seed: true
      convertEmptyValues: true
    seed:
      local:
        sources:
          - table: usersTable

  s3:
    bucket: my-bucket
    region: us-east-1
    host: localhost
    port: 4599
    accessKey: "ACCESS_KEY"
    secretKey: "SECRET_KEY"

# stages:
#   default:
#     params:
#       tableName: "users-table-${sls:stage}"

provider:
  name: aws
  runtime: nodejs20.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  # environment:
  #   USERS_TABLE: ${param:tableName}

functions:
  signin:
    handler: handlers/auth.signinHandler
    events:
      - httpApi:
          path: api/auth/signin
          method: post

  signup:
    handler: handlers/auth.signupHandler
    events:
      - httpApi:
          path: api/auth/signup
          method: post

  getUsers:
    handler: handlers/auth.getUsersHandler
    events:
      - httpApi:
          path: api/auth/users
          method: get

  sendOtp:
    handler: handlers/auth.sendOtpHandler
    events:
      - httpApi:
          path: api/auth/send-otp
          method: post

  resetPassword:
    handler: handlers/auth.resetPasswordHandler
    events:
      - httpApi:
          path: api/auth/reset-password
          method: post

  updatePassword:
    handler: handlers/auth.updatePasswordHandler
    events:
      - httpApi:
          path: api/auth/update-password
          method: post

  # Case Handlers
  getCase:
    handler: handlers/caseHandlers.getCaseHandler
    events:
      - httpApi:
          path: api/case/details/{caseID}
          method: get

  getCases:
    handler: handlers/caseHandlers.getCasesHandler
    events:
      - httpApi:
          path: api/case/all
          method: get

  getOngoingCase:
    handler: handlers/caseHandlers.getOngoingCaseHandler
    events:
      - httpApi:
          path: api/case/ongoing-case
          method: get

  addCase:
    handler: handlers/caseHandlers.addCaseHandler
    events:
      - httpApi:
          path: api/case/add
          method: post

  updateCase:
    handler: handlers/caseHandlers.updateCaseHandler
    events:
      - httpApi:
          path: api/case/update/{caseID}
          method: post

  deleteCase:
    handler: handlers/caseHandlers.deleteCaseHandler
    events:
      - httpApi:
          path: api/case/delete-case/{caseID}
          method: delete

  deleteAllCases:
    handler: handlers/caseHandlers.deleteAllCasesHandler
    events:
      - httpApi:
          path: api/case/delete/all
          method: delete

  duplicateCase:
    handler: handlers/caseHandlers.duplicateCaseHandler
    events:
      - httpApi:
          path: api/case/duplicate
          method: post

  publishCase:
    handler: handlers/caseHandlers.publishCaseHandler
    events:
      - httpApi:
          path: api/case/publish
          method: post

  addFeedback:
    handler: handlers/caseHandlers.addFeedbackHandler
    events:
      - httpApi:
          path: api/case/add/feedback
          method: post

  getCaseFeedback:
    handler: handlers/caseHandlers.getCaseFeedbackHandler
    events:
      - httpApi:
          path: api/case/feedbacks/{caseID}
          method: get

  getCaseAnswers:
    handler: handlers/caseHandlers.getCaseAnswersHandler
    events:
      - httpApi:
          path: api/case/responses/{caseID}
          method: get

  getCaseData:
    handler: handlers/caseHandlers.getCaseDataHandler
    events:
      - httpApi:
          path: api/case/data/{caseID}
          method: get

  getCaseAttemptsByStudent:
    handler: handlers/caseHandlers.getCaseAttemptsByStudentHandler
    events:
      - httpApi:
          path: api/case/student/attempts/{studentID}
          method: get

  # Quiz Handlers
  submitQuiz:
    handler: handlers/quizHandlers.submitCaseAnswersHandler
    events:
      - httpApi:
          path: api/quiz/submit
          method: post

  getQuizAnswers:
    handler: handlers/quizHandlers.getStudentsAnswersHandler
    events:
      - httpApi:
          path: api/quiz/answers/{caseID}
          method: get

  # Student Handlers
  getCertificates:
    handler: handlers/studentHandlers.getStudentCertificatesHandler
    events:
      - httpApi:
          path: api/student/certificates
          method: get

  getCertificateByCaseID:
    handler: handlers/studentHandlers.getCertificateByCaseIDHandler
    events:
      - httpApi:
          path: api/student/certificate/{caseID}
          method: get

resources:
  Resources:
    usersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: usersTable
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    LocalBucket:
      Type: "AWS::S3::Bucket"
      Properties:
        BucketName: local-bucket
