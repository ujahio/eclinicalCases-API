name: Deploy SST App to Staging

on:
  push:
    branches:
      - staging

permissions:
  id-token: write # needed for OIDC
  contents: read # needed for checkout

env:
  NEXT_PUBLIC_REGION: us-east-2
  NEXT_PUBLIC_NODE_ENV: ${{ secrets.NEXT_PUBLIC_NODE_ENV }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
  NEXT_PUBLIC_PASS_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_PASS_SECRET_KEY }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_DOMAIN }}

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest

    steps:
      - name: Clean Next.js build cache
        run: rm -rf .next .open-next

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-nextjs-

      - name: Install dependencies
        run: bun install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh-actions-deployment
          aws-region: ${{ env.NEXT_PUBLIC_REGION }}

      - name: Deploy to Staging
        run: bunx sst deploy --stage preproduction

      - name: Save Bun & Next.js cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}-v1
